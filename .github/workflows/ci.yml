name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MLFLOW_TRACKING_URI: sqlite:////tmp/mlflow.db
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff==0.17.1 prefect==3.8.5
          pip install pytest-cov

      - name: Lint (ruff)
        run: ruff check src tests script

      - name: Tests (pytest)
        run: python -m pytest -v --cov=src --cov-report=term-missing